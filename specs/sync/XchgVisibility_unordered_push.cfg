\* The named negative: UNORDERED push (no membar.sys between the peer payload
\* stores and the seqno release). The strong consume is left ON to isolate the
\* push edge. EXPECTED: TLC MUST report NoStaleConsume violated -- the seqno
\* release passes the payload stores, so the peer polls the seqno, reads the
\* payload STRONG, and still folds a slice STALE in VRAM (the push has not
\* landed). A clean pass means the model lost the push-visibility hazard.
SPECIFICATION Spec
CONSTANTS
    PushFenced = FALSE
    StrongConsume = TRUE
    PushWidth = 1
    FoldWidth = 1
INVARIANTS
    TypeOK
    NoStaleConsume
