\* The named negative: PLAIN consumer reads (no read-read fence between the
\* flag poll and the payload load). The producer release fence is left ON to
\* isolate the consumer edge. EXPECTED: TLC MUST report NoStaleConsume
\* violated -- ptxas hoists the payload load above the flag spin, so the
\* consumer takes the pre-store STALE latch while the flag reads UP. A clean
\* pass means the model lost the read-reorder hazard.
SPECIFICATION Spec
CONSTANTS
    ProducerRelease = TRUE
    ConsumerAcquire = FALSE
INVARIANTS
    TypeOK
    NoStaleConsume
