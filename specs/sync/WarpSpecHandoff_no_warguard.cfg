\* E2 dropped: no consumed-flag WAR guard, so the mover may refill a buffer
\* the consumer has not drained. The fence is left ON to isolate the WAR edge.
\* EXPECTED: TLC MUST report NoStaleTile violated -- the mover overwrites
\* buffer (r % 2) for a later round while the consumer's poll for an earlier
\* round is still latched, so the consumer reads the wrong round's tile. A
\* clean pass means the model lost the buffer-reuse hazard. Run with -deadlock
\* (safety-only): dropping the guard yields BOTH a stale read and a consumer
\* stall, and this negative pins the stale read (NoStaleTile), not the stall.
SPECIFICATION Spec
CONSTANTS
    ProducerFence = TRUE
    WARGuard = FALSE
INVARIANTS
    TypeOK
    NoStaleTile
