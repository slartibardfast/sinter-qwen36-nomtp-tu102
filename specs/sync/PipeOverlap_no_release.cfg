\* The producer-edge negative: no __threadfence_block, so the ready-flag store
\* may pass the operand store. The consumer acquire is left ON to isolate the
\* producer edge. EXPECTED: TLC MUST report NoStaleConsume violated -- the flag
\* reads UP while the slot still holds STALE, so even an acquire read of the
\* live slot returns the previous stage's operand.
SPECIFICATION Spec
CONSTANTS
    ProducerRelease = FALSE
    ConsumerAcquire = TRUE
INVARIANTS
    TypeOK
    NoStaleConsume
