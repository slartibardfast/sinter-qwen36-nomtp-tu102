\* The capstone negative: NO grid.sync at the prefill -> decode seam (a fused
\* kernel that hands over by falling through, trusting each block's own prefill
\* write). EXPECTED: TLC MUST report NoPrematureConsume violated -- a block that
\* finishes its own prefill write enters decode and reads state a slower block
\* has not written yet (premature consume of uninitialized state). A clean pass
\* means the model lost the cross-block handover race. Safety-only; if a
\* consume-then-stall trace is reported as a deadlock, run with -deadlock.
SPECIFICATION Spec
CONSTANTS
    Blocks = {b1, b2}
    HandoverBarrier = FALSE
INVARIANTS
    TypeOK
    NoPrematureConsume
