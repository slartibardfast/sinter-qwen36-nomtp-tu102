\* The consumer-edge negative: PLAIN LDG consume (not .cg). The push fence is
\* left ON to isolate the consume edge. EXPECTED: TLC MUST report NoStaleConsume
\* violated -- the peer's stale L1 line persists, so it folds the previous
\* pass's payload even though the seqno and VRAM are fresh (the measured xgpu
\* 999999/1e6 staleness). A clean pass means the model lost the L1 hazard.
SPECIFICATION Spec
CONSTANTS
    PushFenced = TRUE
    StrongConsume = FALSE
INVARIANTS
    TypeOK
    NoStaleConsume
